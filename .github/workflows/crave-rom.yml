name: star2lte ROM (Crave start)

# Step 1 of 2. Queues a DETACHED LineageOS 22.2 user build on Crave and exits
# fast, so a long free-queue wait can't kill it (the build survives independent
# of this runner). When Crave reports it finished, run the "star2lte ROM
# (Crave publish)" workflow to pull the zip and attach it to a Release.
#
# Requires repo secret CRAVE_CONF (full crave.conf from foss.crave.io).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        default: 'user'
        type: choice
        options: [user, userdebug]
      clean:
        description: 'Clean Crave workspace (first run: yes; resume: no)'
        default: 'yes'
        type: choice
        options: ['yes', 'no']

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install crave CLI
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ./crave "$HOME/bin/crave"; chmod +x "$HOME/bin/crave"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure crave workspace
        run: |
          printf '%s' "${CRAVE_CONF}" > crave.conf
          test -s crave.conf || { echo "::error:: CRAVE_CONF secret missing"; exit 1; }
          git init -q
          git remote add origin https://github.com/accupara/los22.git
          # share one persistent workspace across runners (publish pulls from it)
          printf 'LOS 22.1:\n  ignoreClientHostname: true\n' > crave.yaml
        env:
          CRAVE_CONF: ${{ secrets.CRAVE_CONF }}

      - name: Queue detached build on Crave
        run: |
          CLEAN=""
          [ "${{ github.event.inputs.clean }}" = "yes" ] && CLEAN="--clean"
          echo "Queuing detached build (variant: ${{ github.event.inputs.build_type }})..."
          crave -n run --projectID 93 --no-patch --detached $CLEAN -- \
            "curl -fsSL https://raw.githubusercontent.com/Skyshadow2022/star2lte-los22/main/crave/build.sh | BUILD_TYPE=${{ github.event.inputs.build_type }} bash -s" \
            | tee crave-start.log
          echo "### Detached build queued" >> "$GITHUB_STEP_SUMMARY"
          grep -iE "build id|build/info" crave-start.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "When Crave shows it finished, run **star2lte ROM (Crave publish)** to get the zip." >> "$GITHUB_STEP_SUMMARY"
