name: star2lte ROM (Crave start)

# DETACHED build: queues a LineageOS 22.2 build on Crave and exits fast. The
# build then runs independently on Crave for its full duration (can be 8-10h on
# the free queue) — it does NOT depend on this job staying alive, so GitHub's 6h
# ceiling is irrelevant. When Crave reports it finished (dashboard/email), run
# "star2lte ROM (Crave publish)" to pull the zip into a Release.
#
# Requires repo secret CRAVE_CONF (full crave.conf from foss.crave.io).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        default: 'user'
        type: choice
        options: [user, userdebug]
      clean:
        description: 'Clean workspace? (first build: yes; resume with cache: no)'
        default: 'no'
        type: choice
        options: ['no', 'yes']

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install crave CLI
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ./crave "$HOME/bin/crave"; chmod +x "$HOME/bin/crave"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure crave workspace
        run: |
          printf '%s' "${CRAVE_CONF}" > crave.conf
          test -s crave.conf || { echo "::error:: CRAVE_CONF secret missing"; exit 1; }
          git init -q
          git remote add origin https://github.com/accupara/los22.git
          printf 'LOS 22.1:\n  ignoreClientHostname: true\n' > crave.yaml
        env:
          CRAVE_CONF: ${{ secrets.CRAVE_CONF }}

      - name: Clear any prior jobs on this workspace (avoid conflicts)
        run: |
          crave -n stop --all 2>&1 | tail -10 || true
          sleep 10

      - name: Queue detached build on Crave
        run: |
          CLEAN=""
          [ "${{ github.event.inputs.clean }}" = "yes" ] && CLEAN="--clean"
          echo "Queuing detached ${{ github.event.inputs.build_type }} build (clean=${{ github.event.inputs.clean }})..."
          crave -n run --projectID 93 --no-patch --detached $CLEAN -- \
            "curl -fsSL https://raw.githubusercontent.com/Skyshadow2022/star2lte-los22/main/crave/build.sh | BUILD_TYPE=${{ github.event.inputs.build_type }} bash -s" \
            | tee crave-start.log
          {
            echo "### Detached build queued"
            grep -iE "scheduled|build id|build/info" crave-start.log || true
            echo ""
            echo "It runs on Crave independently (hours). When it finishes, run **star2lte ROM (Crave publish)**."
          } >> "$GITHUB_STEP_SUMMARY"
