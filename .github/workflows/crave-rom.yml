name: star2lte ROM (Crave)

# Attached build: `crave run` streams the full Crave build log into THIS GitHub
# Actions job (reliable cloud network), so failures are diagnosable and a
# success is pulled + published to a Release in the same run. Nothing heavy
# touches the maintainer's local link.
#
# Requires repo secret CRAVE_CONF (full crave.conf from foss.crave.io).

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        default: 'user'
        type: choice
        options: [user, userdebug]
      clean:
        description: 'Clean Crave workspace (first run: yes; resume: no)'
        default: 'yes'
        type: choice
        options: ['yes', 'no']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install crave CLI
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ./crave "$HOME/bin/crave"; chmod +x "$HOME/bin/crave"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure crave workspace
        run: |
          printf '%s' "${CRAVE_CONF}" > crave.conf
          test -s crave.conf || { echo "::error:: CRAVE_CONF secret missing"; exit 1; }
          git init -q
          git remote add origin https://github.com/accupara/los22.git
          printf 'LOS 22.1:\n  ignoreClientHostname: true\n' > crave.yaml
        env:
          CRAVE_CONF: ${{ secrets.CRAVE_CONF }}

      - name: Build on Crave (attached, streams log)
        id: build
        run: |
          CLEAN=""
          [ "${{ github.event.inputs.clean }}" = "yes" ] && CLEAN="--clean"
          crave -n run --projectID 93 --no-patch $CLEAN -- \
            "curl -fsSL https://raw.githubusercontent.com/Skyshadow2022/star2lte-los22/main/crave/build.sh | BUILD_TYPE=${{ github.event.inputs.build_type }} bash -s"

      - name: Pull ROM from Crave
        if: ${{ success() }}
        run: |
          crave -n pull out/artifacts/star2lte-latest.zip || true
          crave -n pull out/artifacts/SHA256SUMS || true
          ls -lh out/artifacts/ 2>/dev/null || true
          test -f out/artifacts/star2lte-latest.zip || { echo "::error:: zip not produced"; exit 1; }

      - name: Publish to GitHub Release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="star2lte-los22.2-${{ github.event.inputs.build_type }}-$(date -u +%Y%m%d).zip"
          cp out/artifacts/star2lte-latest.zip "$out"
          tag="rom-${{ github.run_id }}"
          gh release create "$tag" "$out" out/artifacts/SHA256SUMS --repo "${{ github.repository }}" \
            --title "star2lte LOS 22.2 (${{ github.event.inputs.build_type }})" \
            --notes "Cloud build via Crave. ${{ github.event.inputs.build_type }} + camera fix (HWJPEG_ANDROID_VERSION=10). Download to the phone and flash." \
          || gh release upload "$tag" "$out" out/artifacts/SHA256SUMS --repo "${{ github.repository }}" --clobber
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: On failure, pull error.log
        if: ${{ failure() }}
        run: |
          echo "=== pulling out/error.log (if any) ==="
          crave -n pull out/error.log 2>&1 || true
          echo "----- error.log tail -----"
          tail -200 out/error.log 2>/dev/null || echo "(no error.log — failure was before/at sync)"
