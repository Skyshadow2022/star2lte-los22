name: star2lte kernel v4 (rsuntk rksu modern + SUSFS, v3.x manager)

# Kernel build for the MODERN rsuntk manager line (v3.x): ExyHyperBrick kernel +
# rsuntk/KernelSU branch susfs-rksu-master (KSU 32359, LSM/setuid hooks) +
# simonpunk susfs4ksu kernel-4.9 = SUSFS v1.5.5 fs-layer (the only 4.9-native
# susfs; proven on this tree by the legacy build).
#
# rksu modern speaks the susfs v2-era ABI (void __user ** handlers, err-field
# structs, new CMD ids) which no 4.9 susfs port provides. tools/ bridges it:
#   - susfs_v155_fix.py     merges the 2 v1.5.5 patch rejects (stat.c,
#                           fdinfo.c), gating the spoof on uid >= 10000
#                           (v2-era check; nothing sets the old task bit).
#   - rksu_susfs_compat.c   v2->v1.5.5 ABI adapter compiled into the kernelsu
#                           module: struct translation + set_fs(KERNEL_DS)
#                           calls into the renamed v1.5.5 entry points,
#                           manager ABI (features/variant/version), graceful
#                           no-ops for v2-only features (sus_path_loop,
#                           sus_map, mnt-id reorder).
#   - rksu_compat_wire.py   renames the colliding v1.5.5 entry points to
#                           *_impl, appends the missing CMD ids + handler
#                           declarations, wires the adapter into the module.
#
# Pairs with the rsuntk v3.2.2-10-legacy manager (kernel KSU 32359).
# Publishes to "susfs-v3-ci". Rollback = the working deprecated/susfs-legacy
# boot (susfs-ci / boot-rsuntk-susfs.img) or build #2.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/susfs-v3.yml
      - tools/susfs_v155_fix.py
      - tools/rksu_susfs_compat.c
      - tools/rksu_compat_wire.py

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/ExyHyperBrick/android_kernel_samsung_exynos9810
  KERNEL_BRANCH: lineage-22.2
  DEFCONFIG: exynos9810-star2lte_defconfig
  KSU_REPO: https://github.com/rsuntk/KernelSU
  KSU_BRANCH: susfs-rksu-master
  # simonpunk kernel-4.9 = SUSFS v1.5.5, 4.9-native (old ida API), the only
  # susfs fs-layer proven to build AND boot on this tree.
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: kernel-4.9
  CLANG: clang-r536225
  BASE_BOOT_TAG: 22.2-20260925-build2
  BASE_BOOT_SHA256: 032a6912984e7072ae9a87f56608068a8e37297a154e82d3140b497facf65a14

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio \
            binutils-aarch64-linux-gnu lz4 python3 >/dev/null

      - name: Restore clang
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/clang
          key: ${{ env.CLANG }}

      - name: Fetch AOSP clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/clang
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG}.tar.gz"
          for i in 1 2 3 4 5; do
            curl -fL --retry 3 -o clang.tgz "$url" && gzip -t clang.tgz && break
            echo "clang download attempt $i failed"; rm -f clang.tgz; sleep 20
          done
          tar -xzf clang.tgz -C ~/clang && rm clang.tgz
          ~/clang/bin/clang --version | head -1

      - name: Save clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          echo "clang kept in ~/clang for this job; next run restores from cache key ${{ env.CLANG }}"

      - name: Kernel source + rsuntk KernelSU (rksu modern)
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel
          exec > >(tee "$GITHUB_WORKSPACE/diag.log") 2>&1
          set -x +e
          git clone --depth=1 -b "$KSU_BRANCH" "$KSU_REPO" KernelSU; echo "clone rc=$?"
          ls -la KernelSU/kernel 2>&1 | head -5
          rel=$(realpath --relative-to=drivers KernelSU/kernel); echo "rel=$rel"
          ln -sf "$rel" drivers/kernelsu
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          echo "== checks =="
          ls -la drivers/kernelsu
          echo "Kconfig-has-KSU_SUSFS: $(grep -c 'config KSU_SUSFS' drivers/kernelsu/Kconfig)"
          grep -m1 KSU_VERSION drivers/kernelsu/Makefile
          set -e
          test -e drivers/kernelsu/Kconfig
          grep -q 'config KSU_SUSFS' drivers/kernelsu/Kconfig
          echo "OK: rksu modern wired"

      - name: Apply SUSFS v1.5.5 kernel patch (fs-layer, 4.9-native)
        working-directory: kernel
        run: |
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" ../susfs4ksu
          echo "susfs version:"; grep SUSFS_VERSION ../susfs4ksu/kernel_patches/include/linux/susfs.h
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=3 --no-backup-if-mismatch < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch | tee ../susfs-apply.log || true
          echo "== rejects before fix =="; find . -name '*.rej' | tee ../rejects.txt || true
          # Expected: fs/stat.c.rej + fs/notify/fdinfo.c.rej only; merged by the fix script.
          python3 "$GITHUB_WORKSPACE/tools/susfs_v155_fix.py"
          find . -name '*.rej' -delete
          # AUTO_ADD usage block lands at file scope in RKP-restructured do_mount()
          python3 "$GITHUB_WORKSPACE/tools/susfs_namespace_fix.py" fs/namespace.c

      - name: Wire rksu modern ABI to the v1.5.5 engine
        working-directory: kernel
        run: |
          python3 "$GITHUB_WORKSPACE/tools/rksu_compat_wire.py"
          cp "$GITHUB_WORKSPACE/tools/rksu_susfs_compat.c" drivers/kernelsu/rksu_susfs_compat.c
          # Modern rksu is manual-hook only: the kernel tree must call its
          # ksu_handle_* handlers (reboot supercall, ksud.rc injection, su exec).
          python3 "$GITHUB_WORKSPACE/tools/rksu_manual_hooks.py"
          echo "== sanity =="
          grep -c '_impl' fs/susfs.c
          grep -n 'rksu_susfs_compat.o' drivers/kernelsu/Makefile
          grep -n 'CMD_SUSFS_ADD_SUS_PATH_LOOP' include/linux/susfs_def.h
          grep -c 'rksu manual hook' kernel/reboot.c fs/read_write.c fs/exec.c fs/open.c fs/stat.c
          test -e drivers/kernelsu/rksu_susfs_compat.c

      - name: Remove -dirty from kernel version
        working-directory: kernel
        run: |
          sed -i 's/ -dirty//g; s/printf %s -dirty/printf %s/g' scripts/setlocalversion || true
          sed -i 's/echo "\$res"/res="${res%-dirty}"; echo "$res"/' scripts/setlocalversion || true

      - name: defconfig
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 "$DEFCONFIG"
          # susfs-rksu-master uses LSM/setuid hooks (no kprobe/manual choice).
          # Full v1.5.5 feature set except SUS_MAP (no 4.9 fs hook) and
          # SUS_SU (unused by rksu, known-broken on 4.9).
          cat >> out/.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          # CONFIG_KSU_SUSFS_SUS_MAP is not set
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          EOF
          make O=out ARCH=arm64 olddefconfig
          echo "== effective KSU/SUSFS config ==" | tee "$GITHUB_WORKSPACE/diag.log"
          grep -E '^(CONFIG_KSU|# CONFIG_KSU|CONFIG_SECURITY=)' out/.config | tee -a "$GITHUB_WORKSPACE/diag.log"
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "::error::CONFIG_KSU_SUSFS not set"; exit 1; }
          grep -q '^CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y' out/.config || { echo "::error::AUTO_ADD not set"; exit 1; }

      - name: Build Image
        working-directory: kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          set -o pipefail
          flags="-j$(nproc) O=out ARCH=arm64 CC=clang HOSTCC=clang HOSTCXX=clang++
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          make $flags Image 2>&1 | tee ../build.log
          ls -l out/arch/arm64/boot/Image

      - name: Repack build #2 boot.img
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BASE_BOOT_TAG" --repo "${{ github.repository }}" -p boot.img -O base-boot.img
          echo "$BASE_BOOT_SHA256  base-boot.img" | sha256sum -c
          python3 tools/samsung_bootimg.py repack base-boot.img kernel/out/arch/arm64/boot/Image boot.img
          python3 tools/samsung_bootimg.py info boot.img
          strings kernel/out/arch/arm64/boot/Image | grep -m1 'Linux version'
          mkdir -p dist
          cp boot.img dist/boot-rksu-susfs-v4.img
          tar --format=ustar -C dist -cf dist/boot-rksu-susfs-v4-odin.tar --transform 's/.*/boot.img/' boot-rksu-susfs-v4.img
          cp kernel/out/.config dist/kernel.config
          (cd dist && sha256sum boot-rksu-susfs-v4.img boot-rksu-susfs-v4-odin.tar > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish to "susfs-v3-ci" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          { echo "run ${{ github.run_number }} (${{ github.run_id }}) status ${{ job.status }} sha ${{ github.sha }}"
            [ -f build.log ] && tail -c 900000 build.log || echo "no build log (failed before compile)"; } > dist/build.log
          [ -f diag.log ] && cp diag.log dist/ || true
          [ -f susfs-apply.log ] && cp susfs-apply.log dist/ || true
          echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} status: ${{ job.status }}" > dist/STATUS.txt
          gh release view susfs-v3-ci >/dev/null 2>&1 || gh release create susfs-v3-ci --prerelease \
            --title "Kernel CI v3 (rsuntk rksu + SUSFS, modern manager)" --notes "Rolling builds: rksu modern (KSU 32359) + SUSFS v1.5.5 fs-layer + v2 ABI adapter. Untested until noted in manoto.md."
          gh release upload susfs-v3-ci dist/* --clobber
