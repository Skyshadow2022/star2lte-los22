name: star2lte ROM (Crave diag)

# Pull a finished/failed Crave build's logs from the cloud (reliable network),
# so build failures can be diagnosed without the maintainer's flaky local link.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Crave build id'
        required: true
        default: '303793'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install crave CLI
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          mv ./crave "$HOME/bin/crave"; chmod +x "$HOME/bin/crave"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure crave workspace (same identity)
        run: |
          printf '%s' "${CRAVE_CONF}" > crave.conf
          git init -q
          git remote add origin https://github.com/accupara/los22.git
          printf 'LOS 22.1:\n  ignoreClientHostname: true\n' > crave.yaml
        env:
          CRAVE_CONF: ${{ secrets.CRAVE_CONF }}

      - name: Crave list (job states)
        run: crave -n list 2>&1 | tail -40 || true

      - name: Build progress (ninja %)
        run: |
          echo "=== running jobs ==="
          crave -n list 2>&1 | sed -n '/Job Id/,$p' | tail -20 || true
          jid=$(crave -n list 2>/dev/null | awk '/running/{print $1; exit}')
          echo "running job id: ${jid:-<none>}"
          if [ -n "$jid" ]; then
            echo "=== last ninja progress lines for job $jid ==="
            crave -n getlog --jobID "$jid" 2>&1 | grep -aoE '\[ *[0-9]+% +[0-9]+/[0-9]+\]' | tail -8 || echo "(no ninja progress yet — still syncing?)"
            echo "=== last sync/stage lines ==="
            crave -n getlog --jobID "$jid" 2>&1 | grep -aiE "Syncing|Fetching project|Checking out|repo sync|breakfast|including|installclean|ninja: Entering" | tail -6 || true
          fi

      - name: Dump build log (getlog variants)
        run: |
          echo "===================== getlog --help ====================="
          crave -n getlog --help 2>&1 | head -30 || true
          echo "===================== getlog (current workspace, tail 200) ====================="
          crave -n getlog 2>&1 | tail -200 || true
          echo "===================== getlog --jobID ${{ inputs.build_id }} ====================="
          crave -n getlog --jobID ${{ inputs.build_id }} 2>&1 | tail -200 || true

      - name: Inspect workspace via ssh
        run: |
          echo "===================== ssh: what is in the workspace ====================="
          crave -n ssh -- "pwd; echo '--- top ---'; ls -la | head; echo '--- .repo? ---'; ls -la .repo 2>&1 | head; echo '--- out? ---'; ls -la out 2>&1 | head -40; echo '--- error.log ---'; tail -200 out/error.log 2>&1" 2>&1 || echo "(ssh not available on this account)"
