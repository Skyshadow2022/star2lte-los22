name: star2lte libhwjpeg (camera photo fix)

# Builds ONLY the patched vendor library libhwjpeg for star2lte (camera photo
# save fix: 1-arg ctor for the libexynoscamera3 blob + relaxed Exif dimension
# check). Publishes arm + arm64 libhwjpeg.so to the rolling "camera-ci" release;
# on device they replace /vendor/lib*/libhwjpeg.so directly.
#
# No repo/soong/AOSP-build: the full LOS tree does not fit on a free runner
# (145 GB runner filled by one shallow sync + retries). Instead we clone the
# FIVE projects whose headers the lib needs (~600 MB) and compile directly
# with the runner's clang using -nostdinc + explicit include dirs. Shared
# deps (liblog/libcutils/libutils/libion_exynos/libgiantmscl/libacryl) stay
# undefined and resolve at load time from the vendor namespace.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/libhwjpeg.yml
      - patches/hardware_samsung_slsi-linaro_graphics/**

permissions:
  contents: write

env:
  GRAPHICS: LineageOS/android_hardware_samsung_slsi-linaro_graphics
  EXYNOS: LineageOS/android_hardware_samsung_slsi-linaro_exynos

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Clone the five header/source projects
        run: |
          set -e
          B=lineage-22.2
          mkdir -p tree/hardware/samsung_slsi-linaro tree/system tree/bionic tree/hardware
          clone() { git clone -q --depth=1 -b "$B" "https://github.com/$1" "$2"; }
          clone "$GRAPHICS" tree/hardware/samsung_slsi-linaro/graphics &
          clone "$EXYNOS"   tree/hardware/samsung_slsi-linaro/exynos &
          clone LineageOS/android_hardware_libhardware tree/hardware/libhardware &
          clone LineageOS/android_system_core          tree/system/core &
          clone LineageOS/android_system_logging       tree/system/logging &
          clone LineageOS/android_bionic               tree/bionic &
          wait
          test -d tree/hardware/samsung_slsi-linaro/graphics/base/libhwjpeg
          echo "== disk"; df -h / | tail -1

      - name: Apply camera patch
        working-directory: tree/hardware/samsung_slsi-linaro/graphics
        run: |
          set -e
          PATCH="$GITHUB_WORKSPACE/repo-config/patches/hardware_samsung_slsi-linaro_graphics/0001-libhwjpeg-star2lte-camera-fix.patch"
          { git apply --verbose "$PATCH" \
              || patch -p1 --fuzz=3 --no-backup-if-mismatch < "$PATCH"; } 2>&1 | tee /tmp/patch-apply.log
          grep -q "Correcting inconsistent Exif image" base/libhwjpeg/ExynosJpegEncoderForCamera.cpp
          grep -q ": ExynosJpegEncoderForCamera(bBTBComp, 0) {}" base/libhwjpeg/ExynosJpegEncoderForCamera.cpp

      - name: Build libhwjpeg (arm64 + arm)
        run: |
          {
            set -e
            sudo apt-get install -y -qq libc++-dev libc++abi-dev >/dev/null
            CLANG=clang++
            RES=$(find /usr/lib/llvm-* /usr/lib/clang -maxdepth 6 -type d -name include -path '*lib/clang*' 2>/dev/null | head -1)
            LIBCXX=/usr/include/c++/v1
            [ -d "$LIBCXX" ] || LIBCXX=$(find /usr/lib/llvm-* -maxdepth 5 -type d -name 'c++' -path '*include*' 2>/dev/null | head -1)
            echo "clang builtins: $RES"; echo "libc++: $LIBCXX"
            T=tree/hardware/samsung_slsi-linaro
            B=tree/bionic
            SC=tree/system/core
            SRCDIR=$T/graphics/base/libhwjpeg

            build_arch() {  # <uapi asm dir> <target triple> <output>
              # Project headers as -I; ALL system headers as -isystem AFTER
              # libc++ (its C-wrapper headers use #include_next, which only
              # searches -isystem dirs that come later in the list).
              PROJ="-I$SRCDIR/include -I$T/graphics/base/include \
                -I$T/exynos/include \
                -I$T/graphics/base/libacryl/include \
                -I$T/graphics/base/giantmscl/include \
                -I$T/graphics/base/libion/include"
              # auto-discover exynos/ion/mscl/acryl header dirs (strip the
              # hardware/exynos suffix so <hardware/exynos/x.h> resolves)
              for h in exynos-hwjpeg.h acryl.h giant_mscl.h ion.h; do
                for d in $(find tree/hardware/samsung_slsi-linaro -name "$h" | xargs -n1 dirname); do
                  case "$d" in */hardware/exynos) d="${d%/hardware/exynos}";; esac
                  case "$PROJ" in *"-I$d "*) ;; *) PROJ="$PROJ -I$d";; esac
                done
              done
              SYS="-isystem $LIBCXX \
                -isystem $B/libc/include \
                -isystem $B/libc/kernel/uapi \
                -isystem $B/libc/kernel/uapi/asm-$1 \
                -isystem $B/libc/kernel/android/uapi \
                -isystem $SC/include \
                -isystem $SC/base/include \
                -isystem tree/system/logging/liblog/include \
                -isystem tree/hardware/libhardware/include \
                -isystem $RES"
              mkdir -p out-dist
              "$CLANG" --target=$2 -O2 -fPIC -std=c++17 -nostdinc \
                $SYS $PROJ \
                -DLOG_TAG='"exynos-libhwjpeg"' -DHWJPEG_ANDROID_VERSION=13 \
                "$SRCDIR"/*.cpp \
                -nostdlib -shared -Wl,-soname,libhwjpeg.so -o "out-dist/$3"
              echo "built out-dist/$3"
            }

            build_arch arm64 aarch64-linux-android31 libhwjpeg-arm64.so
            build_arch arm armv7a-linux-androideabi31 libhwjpeg-arm.so
            file out-dist/*.so
            ls -l out-dist/
          } 2>&1 | tee /tmp/build.log

      - name: Collect + verify
        run: |
          mkdir -p dist
          got=0
          for f in out-dist/libhwjpeg-arm64.so out-dist/libhwjpeg-arm.so; do
            [ -f "$f" ] || continue
            cp "$f" dist/; got=1
          done
          [ $got -eq 1 ] || { echo "::error::no libhwjpeg.so produced"; exit 1; }
          cd dist
          for f in libhwjpeg-arm.so libhwjpeg-arm64.so; do
            [ -f "$f" ] || continue
            echo "== $f"; file "$f"
            # C1Eb = the 1-arg ctor symbol the libexynoscamera3 blob may import
            readelf -sW "$f" | grep -c ExynosJpegEncoderForCameraC1Eb || true
          done
          sha256sum libhwjpeg-*.so > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to "camera-ci" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp /tmp/build.log dist/build.log 2>/dev/null || true
          cp /tmp/patch-apply.log dist/patch-apply.log 2>/dev/null || true
          echo "run ${{ github.run_id }} status ${{ job.status }} sha ${{ github.sha }}" > dist/STATUS.txt
          cd repo-config
          gh release view camera-ci >/dev/null 2>&1 || gh release create camera-ci --prerelease \
            --title "Camera libhwjpeg (star2lte)" --notes "Patched libhwjpeg.so — replace /vendor/lib*/libhwjpeg.so on device. See manoto.md."
          gh release upload camera-ci "$GITHUB_WORKSPACE"/dist/* --clobber
