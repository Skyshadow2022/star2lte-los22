name: star2lte libhwjpeg (camera photo fix)

# Builds ONLY the vendor library hardware/samsung_slsi-linaro/graphics/libhwjpeg
# with our camera patch (1-arg ctor for the libexynoscamera3 blob + relaxed Exif
# dimension check so photo capture no longer fails). Publishes the arm and arm64
# libhwjpeg.so to the rolling "camera-ci" release. The .so is dropped onto the
# device by replacing /vendor/lib*/libhwjpeg.so directly (no ROM reflash, no
# module mount that banking apps could detect).
#
# Disk: a shallow full-LOS 22.2 sync fills the entire ~80 GB runner, so after
# the sync everything not needed for this one module is pruned: keep the build
# system, clang/build-tools/go/jdk prebuilts, system/core (cutils/log headers),
# bionic (uapi), device/generic (aosp_arm64 product bits), vendor/lineage
# (envsetup sources it) and hardware/* (exynos/ion/mscl/acryl headers).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/libhwjpeg.yml
      - patches/hardware_samsung_slsi-linaro_graphics/**

permissions:
  contents: write

env:
  MANIFEST_BRANCH: lineage-22.2
  AOSP: /mnt/aosp
  GRAPHICS_PATH: hardware/samsung_slsi-linaro/graphics

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: '/mnt/aosp'

      - name: Prepare build dir
        run: |
          sudo chown -R "$USER" /mnt/aosp
          df -h /mnt/aosp

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git git-lfs gnupg flex bison build-essential \
            zip unzip curl zlib1g-dev libssl-dev python3 python-is-python3 rsync ccache \
            libxml2-utils xsltproc fontconfig file >/dev/null
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "star2lte ci"
          git config --global user.email "ci@example.com"
          git config --global color.ui false

      - name: repo init + local manifest
        working-directory: /mnt/aosp
        run: |
          repo init --depth=1 -u https://github.com/LineageOS/android.git \
            -b "$MANIFEST_BRANCH" --git-lfs --no-clone-bundle
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml" \
            .repo/local_manifests/star2lte.xml

      - name: repo sync (shallow)
        working-directory: /mnt/aosp
        run: |
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            repo sync -c -j4 --no-clone-bundle --optimized-fetch --prune \
              --force-sync --no-tags && ok=1 && break
            echo "repo sync attempt $i failed; retrying"; sleep 30
          done
          echo "== disk after sync"; df -h /mnt
          test -d "$GRAPHICS_PATH/base/libhwjpeg" || { echo "::error::graphics tree missing"; exit 1; }
          [ $ok -eq 1 ] || { echo "::error::repo sync failed after retries"; exit 1; }
          test -d prebuilts/clang/host/linux-x86 || { echo "::error::prebuilts/clang missing (partial sync)"; exit 1; }
          test -d bionic/libc/include || { echo "::error::bionic missing (partial sync)"; exit 1; }
          test -d system/core/include || { echo "::error::system/core missing (partial sync)"; exit 1; }

      - name: Prune tree (free disk — full sync fills ~80 GB)
        working-directory: /mnt/aosp
        run: |
          df -h /mnt | tail -1
          rm -rf .repo frameworks packages kernel bootable test \
            prebuilts/gcc prebuilts/gdb prebuilts/ndk prebuilts/python prebuilts/rust
          for d in device vendor system; do
            keep=core; [ "$d" = device ] && keep=generic; [ "$d" = vendor ] && keep=lineage
            [ -d "$d" ] || continue
            for sub in "$d"/*/; do
              b=$(basename "$sub")
              [ "$b" = "$keep" ] || rm -rf "$sub"
            done
          done
          df -h /mnt | tail -1

      - name: Apply camera patch
        working-directory: /mnt/aosp
        run: |
          cd "$GRAPHICS_PATH"
          set -o pipefail
          PATCH="$GITHUB_WORKSPACE/repo-config/patches/hardware_samsung_slsi-linaro_graphics/0001-libhwjpeg-star2lte-camera-fix.patch"
          { git apply --verbose "$PATCH" \
              || patch -p1 --fuzz=3 --no-backup-if-mismatch < "$PATCH"; } 2>&1 | tee /tmp/patch-apply.log
          echo "== changed:"; git --no-pager diff --stat 2>/dev/null || true
          grep -q "Correcting inconsistent Exif image" base/libhwjpeg/ExynosJpegEncoderForCamera.cpp
          grep -q ": ExynosJpegEncoderForCamera(bBTBComp, 0) {}" base/libhwjpeg/ExynosJpegEncoderForCamera.cpp

      - name: Build libhwjpeg (standalone clang, no soong)
        working-directory: /mnt/aosp
        run: |
          {
            CLANGDIR=$(ls -d prebuilts/clang/host/linux-x86/clang-r536225 2>/dev/null || true)
            [ -z "$CLANGDIR" ] && CLANGDIR=$(ls -d prebuilts/clang/host/linux-x86/clang-r* 2>/dev/null | sort -V | tail -1)
            [ -z "$CLANGDIR" ] && CLANGDIR=$(find prebuilts/clang/host/linux-x86 -maxdepth 2 -type d -name 'clang-*' | head -1)
            CLANG="$CLANGDIR/bin/clang++"
            echo "clang: $CLANG"; "$CLANG" --version | head -1
            CPPINC=$(find "$CLANGDIR" -type d -path '*android_libc++*arm64*' -name 'c++' | head -1)
            [ -n "$CPPINC" ] || CPPINC=$(find "$CLANGDIR" -type d -name 'c++' -path '*include*' | head -1)
            echo "libc++ headers: $CPPINC"
            RESINC=$(find "$CLANGDIR" -type d -name include -path '*clang*' | grep -v android_libc++ | head -1)
            echo "clang builtins: $RESINC"

            build_arch() {  # <arch uapi dir> <target triple> <output>
              INC=""
              for d in system/core/include bionic/libc/include \
                bionic/libc/kernel/uapi bionic/libc/kernel/android/uapi \
                bionic/libc/kernel/uapi/asm-$1 hardware/libhardware/include \
                hardware/samsung_slsi-linaro/exynos/include \
                hardware/samsung_slsi-linaro/graphics/base/libhwjpeg/include \
                hardware/samsung_slsi-linaro/graphics/base/include \
                ; do [ -d "$d" ] && INC="$INC -I$d"; done
              # auto-discover exynos/ion/mscl/acryl header dirs
              for h in exynos-hwjpeg.h acryl.h giant_mscl.h ion.h ExynosExif.h; do
                for d in $(find hardware/samsung_slsi-linaro -name "$h" 2>/dev/null | xargs -n1 dirname 2>/dev/null); do
                  case " $INC " in *" -I$d "*) ;; *) INC="$INC -I$d";; esac
                done
              done
              [ -n "$RESINC" ] && INC="$INC -isystem $RESINC"
              [ -n "$CPPINC" ] && INC="$INC -isystem $CPPINC"
              SRCDIR=hardware/samsung_slsi-linaro/graphics/base/libhwjpeg
              mkdir -p out-dist
              # undefined shared deps (liblog/libcutils/libutils/libion_exynos/
              # libgiantmscl/libacryl) resolve at load time from the vendor namespace
              "$CLANG" --target=$2 -O2 -fPIC -std=c++17 \
                -DLOG_TAG='"exynos-libhwjpeg"' -DHWJPEG_ANDROID_VERSION=13 \
                $INC "$SRCDIR"/*.cpp \
                -nostdlib -shared -Wl,-soname,libhwjpeg.so -o "out-dist/$3" \
                || exit 1
            }

            build_arch arm64 aarch64-linux-android31 libhwjpeg-arm64.so
            build_arch arm armv7a-linux-androideabi31 libhwjpeg-arm.so
            ls -l out-dist/
          } 2>&1 | tee /tmp/build.log

      - name: Collect + verify
        working-directory: /mnt/aosp
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          got=0
          for f in $(find out-dist -name 'libhwjpeg.so' 2>/dev/null); do
            kind=$(file "$f")
            if echo "$kind" | grep -q aarch64; then
              cp "$f" "$GITHUB_WORKSPACE/dist/libhwjpeg-arm64.so"; got=1
              echo "collected arm64: $f"
            elif echo "$kind" | grep -qE 'ARM, EABI5|ELF 32-bit.*ARM'; then
              cp "$f" "$GITHUB_WORKSPACE/dist/libhwjpeg-arm.so"; got=1
              echo "collected arm: $f"
            fi
          done
          [ $got -eq 1 ] || { echo "::error::no libhwjpeg.so produced"; exit 1; }
          cd "$GITHUB_WORKSPACE/dist"
          for f in libhwjpeg-arm.so libhwjpeg-arm64.so; do
            [ -f "$f" ] || continue
            echo "== $f"; file "$f"
            # C1Eb = the 1-arg ctor symbol the libexynoscamera3 blob may import
            readelf -sW "$f" | grep -c ExynosJpegEncoderForCameraC1Eb || true
          done
          sha256sum libhwjpeg-*.so > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to "camera-ci" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: repo-config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tail -c 400000 /tmp/build.log > "$GITHUB_WORKSPACE/dist/build.log" 2>/dev/null || echo "no build log" > "$GITHUB_WORKSPACE/dist/build.log"
          cp /tmp/patch-apply.log "$GITHUB_WORKSPACE/dist/patch-apply.log" 2>/dev/null || true
          echo "run ${{ github.run_id }} status ${{ job.status }} sha ${{ github.sha }}" > "$GITHUB_WORKSPACE/dist/STATUS.txt"
          gh release view camera-ci >/dev/null 2>&1 || gh release create camera-ci --prerelease \
            --title "Camera libhwjpeg (star2lte)" --notes "Patched libhwjpeg.so — replace /vendor/lib*/libhwjpeg.so on device. See manoto.md."
          gh release upload camera-ci "$GITHUB_WORKSPACE"/dist/* --clobber
